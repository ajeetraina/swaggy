name: Swaggy CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check API syntax
        run: node --check api/server.js
      - name: Check sandbox worker syntax
        run: node --check sandbox/server.js
      - name: Test sandbox path policy
        run: node --test sandbox/*.test.js
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Install frontend dependencies
        working-directory: web
        run: npm install
      - name: Build container images
        run: docker compose build
      - name: Build frontend
        working-directory: web
        run: npm run build
      - name: Run Compose smoke tests
        run: bash scripts/compose-smoke.sh
