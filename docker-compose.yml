services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: swaggy
      POSTGRES_USER: swaggy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swaggy-local-only}
    volumes:
      - swaggy_data:/var/lib/postgresql/data
      - ./api/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swaggy -d swaggy"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [swaggy]

  sandbox-worker:
    build: ./sandbox
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 64
    volumes:
      - ./sandbox/fixtures/public:/workspace:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [sandbox]

  api:
    build: ./api
    environment:
      PORT: 4000
      DATABASE_URL: postgres://swaggy:${POSTGRES_PASSWORD:-swaggy-local-only}@db:5432/swaggy
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      SECURITY_PROFILE: ${SECURITY_PROFILE:-protected}
      ALLOW_DESTRUCTIVE_DEMO: ${ALLOW_DESTRUCTIVE_DEMO:-false}
      SANDBOX_URL: http://sandbox-worker:4100
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-4}
      KITS_DIR: /app/kits
      RULES_FILE: /app/rules/sandbox-rules.yaml
    volumes:
      # Agent kits and the authority rules are loaded by the API at startup.
      # The rules are mounted read-only and are not editable through the API.
      - ./kits:/app/kits:ro
      - ./rules:/app/rules:ro
    depends_on:
      db:
        condition: service_healthy
      sandbox-worker:
        condition: service_healthy
    ports: ["${BIND_HOST:-127.0.0.1}:4000:4000"]
    networks: [swaggy, sandbox]

  web:
    build: ./web
    depends_on: [api]
    ports: ["${BIND_HOST:-127.0.0.1}:5173:80"]
    networks: [swaggy]

volumes:
  swaggy_data:

networks:
  swaggy:
    internal: false
  sandbox:
    internal: true
