services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: swaggy
      POSTGRES_USER: swaggy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swaggy-local-only}
    volumes:
      - swaggy_data:/var/lib/postgresql/data
      - ./api/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swaggy -d swaggy"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [swaggy]

  api:
    build: ./api
    environment:
      PORT: 4000
      DATABASE_URL: postgres://swaggy:${POSTGRES_PASSWORD:-swaggy-local-only}@db:5432/swaggy
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      SECURITY_PROFILE: ${SECURITY_PROFILE:-protected}
      ALLOW_DESTRUCTIVE_DEMO: ${ALLOW_DESTRUCTIVE_DEMO:-false}
    depends_on:
      db:
        condition: service_healthy
    ports: ["127.0.0.1:4000:4000"]
    networks: [swaggy]

  web:
    build: ./web
    depends_on: [api]
    ports: ["127.0.0.1:5173:80"]
    networks: [swaggy]

volumes:
  swaggy_data:

networks:
  swaggy:
    internal: false
