server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ {
    proxy_pass http://api:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
  # Real files only under /products/ — a missing image returns 404 so the
  # storefront's <img> onError can fall back to the type icon (instead of the
  # SPA catch-all handing back index.html).
  location /products/ { try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
